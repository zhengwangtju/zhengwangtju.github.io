<article class="card project-card">
  <div class="card__body">
    {% if include.project.tag %}<span class="card__eyebrow">{{ include.project.tag }}</span>{% endif %}
    <h3 class="card__title"><a href="{{ include.project.url | relative_url }}">{{ include.project.title }}</a></h3>
    {% if include.project.summary %}<p class="card__text">{{ include.project.summary }}</p>{% endif %}
  </div>
  <a class="card__more" href="{{ include.project.url | relative_url }}" aria-label="查看项目：{{ include.project.title }}">查看详情<span class="card__arrow" aria-hidden="true">→</span></a>
</article>
