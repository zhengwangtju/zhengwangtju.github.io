{%- assign page_title = page.title | default: site.title -%}
{%- assign desc = page.description | default: site.description -%}
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.remove('no-js');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}{% if page.title %} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ desc }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ desc }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.data.site_info.photo | absolute_url }}">
  <meta name="theme-color" content="#0B0F14">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="{{ site.data.site_info.photo | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script defer src="{{ '/assets/js/lab.js' | relative_url }}"></script>
</head>
