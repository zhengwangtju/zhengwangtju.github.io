<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}" class="no-js">
{%- include layout/head.html -%}
<body class="{% if page.url == '/' %}is-home{% endif %}">
  <script>
  /* 同步去 no-js（防闪烁）→ DOM 就绪后：进入视口才揭示 [data-reveal]，滚动加 .is-scrolled。
     内联、零依赖；JS 关闭时 html.no-js 兜底全可见，绝不出现内容消失。 */
  (function(){
    var root=document.documentElement; root.classList.remove('no-js');
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function init(){
      var nodes=document.querySelectorAll('[data-reveal]');
      if(reduce||!('IntersectionObserver' in window)){
        for(var i=0;i<nodes.length;i++)nodes[i].classList.add('is-visible');
      }else{
        var io=new IntersectionObserver(function(es){
          es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target);}});
        },{rootMargin:'0px 0px -12% 0px',threshold:0.08});
        nodes.forEach(function(n){io.observe(n);});
      }
      var ticking=false;
      function onScroll(){if(!ticking){ticking=true;window.requestAnimationFrame(function(){
        document.body.classList.toggle('is-scrolled',window.scrollY>4);ticking=false;});}}
      document.body.classList.toggle('is-scrolled',window.scrollY>4);
      window.addEventListener('scroll',onScroll,{passive:true});
    }
    if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);
  })();
  </script>
  <a class="skip-link" href="#main">跳到主要内容</a>
  {%- include layout/site-header.html -%}
  <main id="main">
    {{ content }}
  </main>
  {%- include layout/footer.html -%}
</body>
</html>
