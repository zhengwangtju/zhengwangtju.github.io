# 培养理念 / 实验室文化（来自原 culture.html，展示在成员页顶部）
philosophy:
  - 培养具有创新思维、编程能力、写作能力、沟通能力和优秀道德品质的人。
  - 实验室日常：真实项目 + 高水平论文 + 实验室日常管理 + 团队活动。
  - 实验室文化：实事求是，团结协作，做事情有态度、有强度！

